This is a full single-page form you can host on Render for free. It collects Name, ID, Phone, Amount, Period, Purpose.

### 1. The Website Code

html
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Loan Application</title>
<style>
body { font-family: Arial; background: #f5f7fb; padding: 20px; }
.card { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h2 { text-align: center; color: #0b5fff; }
input, select, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
button { width: 100%; padding: 13px; background: #0b5fff; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
button:hover { background: #0847c0; }
</style>
</head>
<body>

<div class="card">
<h2>Loan Application</h2>
<p style="text-align:center; font-size:14px">Fill in to apply</p>

<form id="loanForm">
<input type="text" id="name" placeholder="Full Name" required>
<input type="text" id="id" placeholder="ID Number" required>
<input type="tel" id="phone" placeholder="Phone Number e.g 0712..." required>
<input type="number" id="amount" placeholder="Loan Amount (KES)" required>

<select id="period" required>
<option value="">Repayment Period</option>
<option>1 Week</option>
<option>2 Weeks</option>
<option>1 Month</option>
<option>3 Months</option>
</select>

<textarea id="purpose" placeholder="Purpose of Loan"></textarea>

<button type="submit">Apply Now</button>
</form>

<p id="msg" style="text-align:center; color:green; display:none">Application Received!</p>
</div>

<script>
document.getElementById("loanForm").addEventListener("submit", function(e){
  e.preventDefault();
  const data = {
    name: document.getElementById("name").value,
    id: document.getElementById("id").value,
    phone: document.getElementById("phone").value,
    amount: document.getElementById("amount").value,
    period: document.getElementById("period").value,
    purpose: document.getElementById("purpose").value
  };
  console.log(data);
  // Here you will send to your backend / Telegram / Google Sheet
  document.getElementById("msg").style.display = "block";
  
  // Example: Send to Telegram Bot (replace TOKEN and CHAT_ID)
  // fetch(`https://api.telegram.org/botTOKEN/sendMessage?chat_id=CHAT_ID&text=${JSON.stringify(data)}`)
  
  this.reset();
});
</script>

</body>
</html>
